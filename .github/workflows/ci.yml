name: Rust CI (LLVM 21)

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.runner_os }}
    env:
      LLVM_VERSION: 21
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner_os: ubuntu-latest
            os: linux
          - runner_os: macos-latest
            os: macos
          - runner_os: windows-2022
            os: windows

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt, clippy
          rustflags: ""

      - name: Setup just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.51.0'

      - name: Install LLVM 21 on Ubuntu
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release

          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${LLVM_VERSION}

          sudo apt-get update
          sudo apt-get install -y llvm-${LLVM_VERSION} llvm-${LLVM_VERSION}-dev llvm-${LLVM_VERSION}-tools
          sudo apt-get install -y gcc libpolly-${LLVM_VERSION}-dev

      - name: Cache Homebrew downloads
        if: matrix.os == 'macos'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/Library/Caches/Homebrew/downloads                                                                                                                              
            ~/Library/Caches/Homebrew/api
          key: ${{ runner.os }}-homebrew-llvm-${{ env.LLVM_VERSION }}

      - name: Install LLVM 21 on macOS
        if: matrix.os == 'macos'
        shell: bash
        run: |
          brew update
          brew install llvm@21

          LLVM_PREFIX="$(brew --prefix llvm@21)"
          echo "$LLVM_PREFIX/bin" >> "$GITHUB_PATH"
          echo "LLVM_SYS_211_PREFIX=$LLVM_PREFIX" >> "$GITHUB_ENV"
          echo "LLVM_CONFIG_PATH=$LLVM_PREFIX/bin/llvm-config" >> "$GITHUB_ENV"

      - name: Cache LLVM SDK on Windows
        if: matrix.os == 'windows'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/llvm-21.1.8
          key: windows-2022-llvm-21.1.8-x64-${{ hashFiles('.github/scripts/setup-windows-llvm.ps1') }}

      - name: Prepare LLVM and MSVC on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        timeout-minutes: 30
        run: ./.github/scripts/setup-windows-llvm.ps1 -InstallDir "$env:RUNNER_TEMP/llvm-21.1.8"

      - name: Run CI
        run: just ci
